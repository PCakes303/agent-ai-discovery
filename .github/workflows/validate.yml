name: Discovery validation
on:
  push:
    branches: [main]
    paths:
      - 'LICENSE.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'manifest.json'
      - 'capabilities.json'
      - 'compatibility.json'
      - 'llms.txt'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'docs/**'
      - 'schemas/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'LICENSE.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'manifest.json'
      - 'capabilities.json'
      - 'compatibility.json'
      - 'llms.txt'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'docs/**'
      - 'schemas/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Run schema-backed regression tests
        run: python -m unittest discover -s tests -v
      - name: Build example index
        run: python tools/discovery_index.py examples/discovery.json --output /tmp/discovery-index.json
